<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧸 我的雲端食譜 (Demo)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
      touch-action: manipulation;
    }
    /* 強制撐開底部空間，確保內容能被推到固定底欄之上 */
    .bottom-buffer { 
      padding-bottom: calc(12.5rem + env(safe-area-inset-bottom)) !important; 
    }
  </style>
</head>
<body class="bg-[#FDFBF7] text-[#5C4D3C] min-h-screen flex flex-col selection:bg-orange-200">

  <header class="bg-[#FFEDD5] border-b-4 border-[#E2C2A4] sticky top-0 z-40 shadow-sm">
    <div class="max-w-md mx-auto px-5 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wider text-[#7C5936] flex items-center gap-1.5">
        <span>👨‍🍳</span> 我的食譜記錄本
      </h1>
      <span class="text-[10px] font-bold bg-amber-200 text-amber-800 px-2 py-0.5 rounded-md border border-amber-400">本地存儲版</span>
    </div>
  </header>

  <main class="flex-1 max-w-md w-full mx-auto p-4 bottom-buffer">
    
    <div id="loading" class="hidden fixed inset-0 bg-amber-900/20 z-50 flex items-center justify-center">
      <div class="bg-white px-6 py-5 rounded-3xl border-4 border-[#E2C2A4] flex flex-col items-center gap-2 shadow-lg">
        <span class="animate-bounce text-3xl">🍳</span>
        <span class="font-bold text-sm text-[#7C5936]">正在加入愛心調味料...</span>
      </div>
    </div>

    <section id="viewTab" class="space-y-4">
      <div class="relative">
        <input type="text" id="searchBar" placeholder="🔍 搜尋食譜或材料..." 
          class="w-full border-3 border-[#E2C2A4] rounded-2xl px-4 py-2.5 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#F0A98F] placeholder:text-gray-400 font-medium">
      </div>
      
      <div id="recipeList" class="space-y-4"></div>
    </section>

    <section id="formTab" class="hidden bg-white p-5 rounded-3xl border-4 border-[#E2C2A4] shadow-sm space-y-4">
      <h2 id="formTitle" class="text-base font-bold text-[#7C5936] bg-[#FFEDD5] -mx-5 -mt-5 p-4 rounded-t-[20px] border-b-4 border-[#E2C2A4] flex items-center gap-1">
        ✨ 新增健康食譜
      </h2>
      <form id="recipeForm" class="space-y-4 text-sm font-bold">
        <input type="hidden" id="recipeId">
        
        <div>
          <label class="block text-xs text-[#8C7662] mb-1">🍎 食譜名稱 *</label>
          <input type="text" id="recipeName" required class="w-full border-2 border-[#E2C2A4] rounded-xl p-2.5 focus:outline-none focus:border-[#F0A98F]" placeholder="例：草莓雲朵厚鬆餅">
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div class="bg-[#FFF7ED] p-2 rounded-xl border border-orange-100">
            <label class="block text-xs text-orange-700 mb-1">🔥 熱量 (kcal)</label>
            <input type="number" id="calories" inputmode="numeric" class="w-full bg-white border-2 border-[#E2C2A4] rounded-lg p-1.5 text-center" placeholder="0">
          </div>
          <div class="bg-[#FEFCE8] p-2 rounded-xl border border-yellow-100">
            <label class="block text-xs text-yellow-700 mb-1">🍞 碳水 (g)</label>
            <input type="number" id="carbs" step="0.1" inputmode="decimal" class="w-full bg-white border-2 border-[#E2C2A4] rounded-lg p-1.5 text-center" placeholder="0">
          </div>
          <div class="bg-[#EEF2FF] p-2 rounded-xl border border-indigo-100">
            <label class="block text-xs text-indigo-700 mb-1">🥩 蛋白質 (g)</label>
            <input type="number" id="protein" step="0.1" inputmode="decimal" class="w-full bg-white border-2 border-[#E2C2A4] rounded-lg p-1.5 text-center" placeholder="0">
          </div>
          <div class="bg-[#F0FDF4] p-2 rounded-xl border border-green-100">
            <label class="block text-xs text-green-700 mb-1">🥑 脂肪 (g)</label>
            <input type="number" id="fat" step="0.1" inputmode="decimal" class="w-full bg-white border-2 border-[#E2C2A4] rounded-lg p-1.5 text-center" placeholder="0">
          </div>
        </div>

        <div>
          <label class="block text-xs text-[#8C7662] mb-1">🛒 材料準備</label>
          <textarea id="ingredients" rows="3" class="w-full border-2 border-[#E2C2A4] rounded-xl p-2.5 focus:outline-none" placeholder="每行輸入一項材料呀..."></textarea>
        </div>

        <div>
          <label class="block text-xs text-[#8C7662] mb-1">🍳 料理步驟</label>
          <textarea id="steps" rows="4" class="w-full border-2 border-[#E2C2A4] rounded-xl p-2.5 focus:outline-none" placeholder="1. 把愛心放進去...&#10;2. 攪拌均勻..."></textarea>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="button" id="cancelBtn" class="flex-1 bg-gray-100 text-gray-500 py-3 rounded-2xl border-2 border-gray-300 shadow-[0_3px_0_#D1D5DB] active:translate-y-0.5 active:shadow-none">取消</button>
          <button type="submit" class="flex-1 bg-[#F0A98F] text-white py-3 rounded-2xl border-2 border-[#D98366] shadow-[0_3px_0_#D98366] active:translate-y-0.5 active:shadow-none">🌟 儲存食譜</button>
        </div>
      </form>
    </section>

    <section id="recordTab" class="hidden space-y-4">
      
      <div class="bg-[#FFFBEB] p-3.5 rounded-2xl border-2 border-[#E2C2A4] flex items-center justify-between gap-2 shadow-sm">
        <label for="logDate" class="text-xs font-bold text-[#7C5936] whitespace-nowrap flex items-center gap-1">📅 選擇查看日期：</label>
        <input type="date" id="logDate" class="flex-1 max-w-[180px] bg-white border-2 border-[#E2C2A4] rounded-xl px-2 py-1.5 text-sm font-bold text-[#5C4D3C] focus:outline-none focus:border-[#F0A98F]">
      </div>

      <div class="bg-white p-4 rounded-3xl border-3 border-[#E2C2A4] shadow-[0_4px_0_#E2C2A4]">
        <div class="flex justify-between items-center border-b-2 border-dashed border-[#E2C2A4] pb-2 mb-2">
          <h3 class="font-bold text-[#7C5936] flex items-center gap-1">🍳 早餐記錄</h3>
          <button onclick="openManualLogModal('breakfast')" class="text-xs bg-[#FFEDD5] border border-[#E2C2A4] px-2.5 py-1 rounded-xl font-bold text-[#7C5936]">➕ 手動填入</button>
        </div>
        <div id="list-breakfast" class="space-y-1.5 text-xs font-medium text-gray-600"></div>
      </div>

      <div class="bg-white p-4 rounded-3xl border-3 border-[#E2C2A4] shadow-[0_4px_0_#E2C2A4]">
        <div class="flex justify-between items-center border-b-2 border-dashed border-[#E2C2A4] pb-2 mb-2">
          <h3 class="font-bold text-[#7C5936] flex items-center gap-1">🍱 午餐記錄</h3>
          <button onclick="openManualLogModal('lunch')" class="text-xs bg-[#FFEDD5] border border-[#E2C2A4] px-2.5 py-1 rounded-xl font-bold text-[#7C5936]">➕ 手動填入</button>
        </div>
        <div id="list-lunch" class="space-y-1.5 text-xs font-medium text-gray-600"></div>
      </div>

      <div class="bg-white p-4 rounded-3xl border-3 border-[#E2C2A4] shadow-[0_4px_0_#E2C2A4]">
        <div class="flex justify-between items-center border-b-2 border-dashed border-[#E2C2A4] pb-2 mb-2">
          <h3 class="font-bold text-[#7C5936] flex items-center gap-1">🍲 晚餐記錄</h3>
          <button onclick="openManualLogModal('dinner')" class="text-xs bg-[#FFEDD5] border border-[#E2C2A4] px-2.5 py-1 rounded-xl font-bold text-[#7C5936]">➕ 手動填入</button>
        </div>
        <div id="list-dinner" class="space-y-1.5 text-xs font-medium text-gray-600"></div>
      </div>

      <div class="bg-white p-4 rounded-3xl border-3 border-[#E2C2A4] shadow-[0_4px_0_#E2C2A4]">
        <div class="flex justify-between items-center border-b-2 border-dashed border-[#E2C2A4] pb-2 mb-2">
          <h3 class="font-bold text-[#7C5936] flex items-center gap-1">🍎 其他/點心</h3>
          <button onclick="openManualLogModal('other')" class="text-xs bg-[#FFEDD5] border border-[#E2C2A4] px-2.5 py-1 rounded-xl font-bold text-[#7C5936]">➕ 手動填入</button>
        </div>
        <div id="list-other" class="space-y-1.5 text-xs font-medium text-gray-600"></div>
      </div>
    </section>

  </main>

  <div id="manualLogModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xs p-5 rounded-3xl border-4 border-[#E2C2A4] shadow-xl space-y-3 font-bold text-sm">
      <h3 id="modalLogTitle" class="text-[#7C5936] border-b pb-1">➕ 手動記一筆</h3>
      <input type="hidden" id="modalLogMealType">
      <div>
        <label class="block text-xs text-gray-400 mb-1">食物名稱</label>
        <input type="text" id="logName" required class="w-full border-2 border-[#E2C2A4] rounded-xl p-2 font-medium" placeholder="例如：香蕉、茶葉蛋">
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="block text-gray-400 mb-0.5">🔥 熱量(kcal)</label>
          <input type="number" id="logCal" class="w-full border-2 border-[#E2C2A4] rounded-lg p-1 text-center" value="0">
        </div>
        <div>
          <label class="block text-gray-400 mb-0.5">🍞 碳水(g)</label>
          <input type="number" id="logCarbs" step="0.1" class="w-full border-2 border-[#E2C2A4] rounded-lg p-1 text-center" value="0">
        </div>
        <div>
          <label class="block text-gray-400 mb-0.5">🥩 蛋白(g)</label>
          <input type="number" id="logProtein" step="0.1" class="w-full border-2 border-[#E2C2A4] rounded-lg p-1 text-center" value="0">
        </div>
        <div>
          <label class="block text-gray-400 mb-0.5">🥑 脂肪(g)</label>
          <input type="number" id="logFat" step="0.1" class="w-full border-2 border-[#E2C2A4] rounded-lg p-1 text-center" value="0">
        </div>
      </div>
      <div class="flex gap-2 pt-1">
        <button onclick="closeManualLogModal()" class="flex-1 bg-gray-100 py-2 rounded-xl text-xs border border-gray-300">取消</button>
        <button onclick="saveManualLog()" class="flex-1 bg-[#F0A98F] text-white py-2 rounded-xl text-xs border border-[#D98366]">確認加入</button>
      </div>
    </div>
  </div>

  <div id="importMealModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xs p-5 rounded-3xl border-4 border-[#E2C2A4] shadow-xl text-center font-bold space-y-4">
      <h3 class="text-[#7C5936] border-b pb-2">🍱 要匯入到哪一餐呢？</h3>
      <div class="grid grid-cols-1 gap-2">
        <button onclick="executeImport('breakfast')" class="py-2.5 bg-[#FFF7ED] border-2 border-[#E2C2A4] rounded-xl text-[#7C5936] active:bg-orange-100">🍳 早餐記錄</button>
        <button onclick="executeImport('lunch')" class="py-2.5 bg-[#FEFCE8] border-2 border-[#E2C2A4] rounded-xl text-[#7C5936] active:bg-yellow-100">🍱 午餐記錄</button>
        <button onclick="executeImport('dinner')" class="py-2.5 bg-[#EEF2FF] border-2 border-[#E2C2A4] rounded-xl text-[#7C5936] active:bg-indigo-100">🍲 晚餐記錄</button>
        <button onclick="executeImport('other')" class="py-2.5 bg-[#F0FDF4] border-2 border-[#E2C2A4] rounded-xl text-[#7C5936] active:bg-green-100">🍎 其他 / 點心</button>
      </div>
      <button onclick="closeImportMealModal()" class="w-full text-xs text-gray-400 pt-2 underline">取消</button>
    </div>
  </div>

  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t-4 border-[#E2C2A4] z-30 shadow-lg">
    <div class="max-w-md mx-auto">
      
      <div id="summaryPanel" class="bg-[#FFFBEB] px-4 py-3 border-b-2 border-dashed border-[#E2C2A4]">
        <div class="text-xs font-bold text-[#7C5936] mb-1.5 flex justify-between items-center">
          <span id="summaryTitle">✨ 菜單勾選總計：</span>
          <button id="importBtn" class="hidden bg-[#F0A98F] text-white border border-[#D98366] px-2 py-0.5 rounded-lg text-[11px] animate-pulse">📥 匯入至每日記錄</button>
        </div>
        <div class="grid grid-cols-4 text-center text-xs font-bold gap-1 bg-white p-2 rounded-xl border-2 border-[#E2C2A4]">
          <div class="text-orange-600">🔥 <span id="totalCal" class="block text-sm">0</span><span class="text-[10px] text-gray-400">kcal</span></div>
          <div class="text-yellow-600">🍞 <span id="totalCarbs" class="block text-sm">0</span><span class="text-[10px] text-gray-400">碳水(g)</span></div>
          <div class="text-indigo-600">🥩 <span id="totalProtein" class="block text-sm">0</span><span class="text-[10px] text-gray-400">蛋白(g)</span></div>
          <div class="text-green-600">🥑 <span id="totalFat" class="block text-sm">0</span><span class="text-[10px] text-gray-400">脂肪(g)</span></div>
        </div>
      </div>
      
      <div class="grid grid-cols-3 h-16 text-xs font-bold border-t">
        <button id="navView" class="flex flex-col items-center justify-center text-[#7C5936] bg-[#FFEDD5]">
          <span class="text-xl">📖</span>
          <span class="mt-0.5">菜單瀏覽</span>
        </button>
        <button id="navRecord" class="flex flex-col items-center justify-center text-gray-400 hover:text-[#7C5936] transition-colors">
          <span class="text-xl">📝</span>
          <span class="mt-0.5">每日記錄</span>
        </button>
        <button id="navAdd" class="flex flex-col items-center justify-center text-gray-400 hover:text-[#7C5936] transition-colors">
          <span class="text-xl">🍳</span>
          <span class="mt-0.5">新增食譜</span>
        </button>
      </div>
    </div>
  </footer>

  <script>
    // 🍓 預設的 Demo 食譜數據
    const DEFAULT_RECIPES = [
      { ID: "demo_1", 食譜名稱: "🍓 草莓雲朵厚鬆餅", 熱量: 320, 碳水: 45, 蛋白質: 12, 脂肪: 10, 材料: "低筋麵粉 100g\n雞蛋 2顆", 做法: "1. 打發蛋白..." },
      { ID: "demo_2", 食譜名稱: "🥑 繽紛酪梨蝦仁沙拉", 熱量: 260, 碳水: 12, 蛋白質: 18, 脂肪: 16, 材料: "熟酪梨 半顆\n鮮蝦仁 8隻", 做法: "1. 蝦仁燙熟..." },
      { ID: "demo_3", 食譜名稱: "🍗 日式蜂蜜照燒雞胸肉", 熱量: 380, 碳水: 15, 蛋白質: 35, 脂肪: 8, 材料: "優質雞胸肉 200g", 做法: "1. 雞胸肉切厚片..." }
    ]; 

    // 從 LocalStorage 載入食譜，若沒有則用預設值
    let ALL_RECIPES = JSON.parse(localStorage.getItem('ALL_RECIPES'));
    if (!ALL_RECIPES) {
      ALL_RECIPES = DEFAULT_RECIPES;
      localStorage.setItem('ALL_RECIPES', JSON.stringify(ALL_RECIPES));
    }

    // 從 LocalStorage 載入大飲食日誌字典。格式： { "2026-06-08": { breakfast: [], lunch: [], ... } }
    let MASTER_LOGS = JSON.parse(localStorage.getItem('MASTER_LOGS')) || {};

    let SELECTED_IDS = new Set(); // 記錄當前菜單勾選的 ID
    let CURRENT_TAB = 'view';     // view, record, form
    let TARGET_DATE = "";         // 當前選定的記錄日期 (YYYY-MM-DD)

    const dom = {
      viewTab: document.getElementById('viewTab'),
      formTab: document.getElementById('formTab'),
      recordTab: document.getElementById('recordTab'),
      recipeList: document.getElementById('recipeList'),
      searchBar: document.getElementById('searchBar'),
      recipeForm: document.getElementById('recipeForm'),
      formTitle: document.getElementById('formTitle'),
      recipeId: document.getElementById('recipeId'),
      navView: document.getElementById('navView'),
      navRecord: document.getElementById('navRecord'),
      navAdd: document.getElementById('navAdd'),
      cancelBtn: document.getElementById('cancelBtn'),
      importBtn: document.getElementById('importBtn'),
      summaryTitle: document.getElementById('summaryTitle'),
      totalCal: document.getElementById('totalCal'),
      totalCarbs: document.getElementById('totalCarbs'),
      totalProtein: document.getElementById('totalProtein'),
      totalFat: document.getElementById('totalFat'),
      loading: document.getElementById('loading'),
      logDate: document.getElementById('logDate')
    };

    window.addEventListener('DOMContentLoaded', () => {
      // 預設日期為「今天」
      const today = new Date().toISOString().split('T')[0];
      dom.logDate.value = today;
      TARGET_DATE = today;

      renderRecipes(ALL_RECIPES);
      updateUI();

      // 監聽日期更換
      dom.logDate.addEventListener('change', (e) => {
        TARGET_DATE = e.target.value;
        renderDailyLogs();
        updateUI();
      });
    });

    // 取得當天特定日期的資料結構，如果沒有就初始化空的
    function getDayLog(dateStr) {
      if (!MASTER_LOGS[dateStr]) {
        MASTER_LOGS[dateStr] = { breakfast: [], lunch: [], dinner: [], other: [] };
      }
      return MASTER_LOGS[dateStr];
    }

    // 存入 LocalStorage 保持永久記憶
    function saveToStorage() {
      localStorage.setItem('MASTER_LOGS', JSON.stringify(MASTER_LOGS));
      localStorage.setItem('ALL_RECIPES', JSON.stringify(ALL_RECIPES));
    }

    // 渲染食譜卡片
    function renderRecipes(recipes) {
      dom.recipeList.innerHTML = "";
      if (recipes.length === 0) {
        dom.recipeList.innerHTML = `<div class="text-center py-12 text-gray-400 text-sm font-bold">找不到這道料理呢 🍓</div>`;
        return;
      }
      recipes.forEach(item => {
        const isChecked = SELECTED_IDS.has(item.ID.toString()) ? 'checked' : '';
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-3xl border-3 border-[#E2C2A4] shadow-[0_4px_0_#E2C2A4] flex gap-3 items-start transition active:scale-[0.99]";
        card.innerHTML = `
          <div class="pt-1"><input type="checkbox" data-id="${item.ID}" ${isChecked} class="recipe-checkbox w-5 h-5 rounded-md border-2 border-[#E2C2A4] text-[#F0A98F] focus:ring-[#F0A98F]"></div>
          <div class="flex-1" onclick="toggleDetails('${item.ID}')">
            <div class="flex justify-between items-start">
              <h3 class="font-bold text-[#5C4D3C] text-base">${item.食譜名稱}</h3>
              <button onclick="event.stopPropagation(); dataEdit('${item.ID}')" class="text-xs text-[#7C5936] font-bold px-2.5 py-1 bg-[#FFEDD5] border border-[#E2C2A4] rounded-xl shadow-[0_1.5px_0_#E2C2A4]">編輯</button>
            </div>
            <div class="flex flex-wrap gap-x-2.5 gap-y-1 text-xs text-[#8C7662] mt-2 font-bold">
              <span class="bg-orange-50 px-1.5 py-0.5 rounded-md">🔥 ${item.熱量}</span>
              <span class="bg-yellow-50 px-1.5 py-0.5 rounded-md">🍞 碳水 ${item.碳水}g</span>
              <span class="bg-indigo-50 px-1.5 py-0.5 rounded-md">🥩 蛋 ${item.蛋白質}g</span>
              <span class="bg-green-50 px-1.5 py-0.5 rounded-md">🥑 脂 ${item.脂肪}g</span>
            </div>
            <div id="detail-${item.ID}" class="hidden mt-3 pt-3 border-t-2 border-dashed border-[#E2C2A4] text-xs space-y-2">
              <div><strong class="text-[#7C5936]">🛒 材料：</strong><p class="whitespace-pre-line bg-[#FFFBF7] p-2 border rounded-xl">${item.材料 || '無'}</p></div>
              <div><strong class="text-[#7C5936]">🍳 做法：</strong><p class="whitespace-pre-line bg-[#FFFBF7] p-2 border rounded-xl">${item.做法 || '無'}</p></div>
            </div>
          </div>
        `;
        dom.recipeList.appendChild(card);
      });

      document.querySelectorAll('.recipe-checkbox').forEach(box => {
        box.addEventListener('change', (e) => {
          const id = e.target.getAttribute('data-id').toString();
          if (e.target.checked) SELECTED_IDS.add(id);
          else SELECTED_IDS.delete(id);
          updateUI();
        });
      });
    }

    function toggleDetails(id) {
      const detailDiv = document.getElementById(`detail-${id}`);
      if(detailDiv) detailDiv.classList.toggle('hidden');
    }

    // 渲染當前日期的飲食記錄清單
    function renderDailyLogs() {
      const dayData = getDayLog(TARGET_DATE);
      const meals = ['breakfast', 'lunch', 'dinner', 'other'];
      
      meals.forEach(type => {
        const container = document.getElementById(`list-${type}`);
        container.innerHTML = "";
        if (dayData[type].length === 0) {
          container.innerHTML = `<span class="text-gray-300 italic block py-1">這天還沒有填寫記錄唷～</span>`;
          return;
        }
        dayData[type].forEach((log, index) => {
          const item = document.createElement('div');
          item.className = "flex justify-between items-center bg-[#FFFBF7] p-2 border border-[#E2C2A4] rounded-xl font-bold text-[#5C4D3C] my-1";
          item.innerHTML = `
            <div>
              <span class="text-sm">${log.name}</span>
              <span class="text-[10px] text-gray-400 block font-normal">🔥${log.calories}kcal | 🍞${log.carbs}g | 🥩${log.protein}g | 🥑${log.fat}g</span>
            </div>
            <button onclick="deleteLog('${type}', ${index})" class="text-red-400 text-xs px-2 py-1">❌</button>
          `;
          container.appendChild(item);
        });
      });
    }

    // 刪除某筆記錄
    function deleteLog(type, index) {
      const dayData = getDayLog(TARGET_DATE);
      dayData[type].splice(index, 1);
      saveToStorage();
      renderDailyLogs();
      updateUI();
    }

    // 核心數據加總控制
    function updateUI() {
      let totalCal = 0, totalCarbs = 0, totalProtein = 0, totalFat = 0;

      if (CURRENT_TAB === 'record') {
        dom.summaryTitle.innerText = `✨ ${TARGET_DATE} 攝取總加總：`;
        dom.importBtn.classList.add('hidden');
        
        const dayData = getDayLog(TARGET_DATE);
        ['breakfast', 'lunch', 'dinner', 'other'].forEach(type => {
          dayData[type].forEach(log => {
            totalCal += log.calories;
            totalCarbs += log.carbs;
            totalProtein += log.protein;
            totalFat += log.fat;
          });
        });
      } else {
        dom.summaryTitle.innerText = "✨ 菜單勾選總計：";
        ALL_RECIPES.forEach(item => {
          if (SELECTED_IDS.has(item.ID.toString())) {
            totalCal += Number(item.熱量) || 0;
            totalCarbs += Number(item.碳水) || 0;
            totalProtein += Number(item.蛋白質) || 0;
            totalFat += Number(item.脂肪) || 0;
          }
        });
        if (SELECTED_IDS.size > 0 && CURRENT_TAB === 'view') dom.importBtn.classList.remove('hidden');
        else dom.importBtn.classList.add('hidden');
      }

      dom.totalCal.innerText = totalCal;
      dom.totalCarbs.innerText = totalCarbs.toFixed(1);
      dom.totalProtein.innerText = totalProtein.toFixed(1);
      dom.totalFat.innerText = totalFat.toFixed(1);
    }

    // 匯入功能邏輯
    dom.importBtn.addEventListener('click', () => {
      document.getElementById('importMealModal').classList.remove('hidden');
    });
    function closeImportMealModal() {
      document.getElementById('importMealModal').classList.add('hidden');
    }
    function executeImport(mealType) {
      const dayData = getDayLog(TARGET_DATE);
      ALL_RECIPES.forEach(item => {
        if (SELECTED_IDS.has(item.ID.toString())) {
          dayData[mealType].push({
            name: item.食譜名稱,
            calories: Number(item.熱量) || 0,
            carbs: Number(item.碳水) || 0,
            protein: Number(item.蛋白質) || 0,
            fat: Number(item.脂肪) || 0
          });
        }
      });
      SELECTED_IDS.clear();
      saveToStorage();
      renderRecipes(ALL_RECIPES);
      closeImportMealModal();
      switchTab('record'); 
    }

    // 手動填入控制
    function openManualLogModal(mealType) {
      const typeNames = { breakfast: '早餐 🍳', lunch: '午餐 🍱', dinner: '晚餐 🍲', other: '其他 🍎' };
      document.getElementById('modalLogTitle').innerText = `➕ 手動記一筆 - ${typeNames[mealType]}`;
      document.getElementById('modalLogMealType').value = mealType;
      document.getElementById('logName').value = "";
      document.getElementById('logCal').value = 0;
      document.getElementById('logCarbs').value = 0;
      document.getElementById('logProtein').value = 0;
      document.getElementById('logFat').value = 0;
      document.getElementById('manualLogModal').classList.remove('hidden');
    }
    function closeManualLogModal() {
      document.getElementById('manualLogModal').classList.add('hidden');
    }
    function saveManualLog() {
      const type = document.getElementById('modalLogMealType').value;
      const name = document.getElementById('logName').value.trim() || "未命名食物";
      const dayData = getDayLog(TARGET_DATE);
      dayData[type].push({
        name: name,
        calories: Number(document.getElementById('logCal').value) || 0,
        carbs: Number(document.getElementById('logCarbs').value) || 0,
        protein: Number(document.getElementById('logProtein').value) || 0,
        fat: Number(document.getElementById('logFat').value) || 0
      });
      saveToStorage();
      renderDailyLogs();
      updateUI();
      closeManualLogModal();
    }

    // 搜尋過濾
    dom.searchBar.addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase();
      const filtered = ALL_RECIPES.filter(item => item.食譜名稱.toLowerCase().includes(keyword) || item.材料.toLowerCase().includes(keyword));
      renderRecipes(filtered);
    });

    // 儲存/新增食譜
    dom.recipeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      showLoading(true);
      setTimeout(() => {
        const id = dom.recipeId.value;
        const recipeData = {
          ID: id || "local_" + new Date().getTime(),
          食譜名稱: document.getElementById('recipeName').value,
          熱量: Number(document.getElementById('calories').value) || 0,
          碳水: Number(document.getElementById('carbs').value) || 0,
          蛋白質: Number(document.getElementById('protein').value) || 0,
          脂肪: Number(document.getElementById('fat').value) || 0,
          材料: document.getElementById('ingredients').value,
          做法: document.getElementById('steps').value
        };
        if (id) {
          const idx = ALL_RECIPES.findIndex(r => r.ID.toString() === id.toString());
          if (idx !== -1) ALL_RECIPES[idx] = recipeData;
        } else {
          ALL_RECIPES.unshift(recipeData);
        }
        saveToStorage();
        dom.recipeForm.reset();
        switchTab('view');
        renderRecipes(ALL_RECIPES);
        showLoading(false);
      }, 500);
    });

    function dataEdit(id) {
      const item = ALL_RECIPES.find(r => r.ID.toString() === id.toString());
      if (!item) return;
      dom.formTitle.innerHTML = "✏️ 編輯食譜明細";
      dom.recipeId.value = item.ID;
      document.getElementById('recipeName').value = item.食譜名稱;
      document.getElementById('calories').value = item.熱量;
      document.getElementById('carbs').value = item.碳水;
      document.getElementById('protein').value = item.蛋白質;
      document.getElementById('fat').value = item.脂肪;
      document.getElementById('ingredients').value = item.材料;
      document.getElementById('steps').value = item.做法;
      switchTab('form');
    }

    // 頁籤分頁切換
    function switchTab(tab) {
      CURRENT_TAB = tab;
      dom.viewTab.classList.add('hidden');
      dom.recordTab.classList.add('hidden');
      dom.formTab.classList.add('hidden');
      
      [dom.navView, dom.navRecord, dom.navAdd].forEach(btn => btn.classList.remove('bg-[#FFEDD5]', 'text-[#7C5936]'));
      [dom.navView, dom.navRecord, dom.navAdd].forEach(btn => btn.classList.add('text-gray-400'));

      if (tab === 'view') {
        dom.viewTab.classList.remove('hidden');
        dom.navView.classList.add('bg-[#FFEDD5]', 'text-[#7C5936]');
      } else if (tab === 'record') {
        dom.recordTab.classList.remove('hidden');
        dom.navRecord.classList.add('bg-[#FFEDD5]', 'text-[#7C5936]');
        renderDailyLogs();
      } else {
        dom.formTab.classList.remove('hidden');
        dom.navAdd.classList.add('bg-[#FFEDD5]', 'text-[#7C5936]');
      }
      updateUI();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showLoading(show) { dom.loading.classList.toggle('hidden', !show); }

    dom.navView.addEventListener('click', () => switchTab('view'));
    dom.navRecord.addEventListener('click', () => switchTab('record'));
    dom.navAdd.addEventListener('click', () => {
      dom.formTitle.innerHTML = "✨ 新增健康食譜";
      dom.recipeId.value = "";
      dom.recipeForm.reset();
      switchTab('form');
    });
    dom.cancelBtn.addEventListener('click', () => switchTab('view'));
  </script>
</body>
</html>
